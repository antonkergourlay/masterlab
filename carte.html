<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte interactive · Master Lab</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="carte">
<main class="wrap col gap-20 pt-32">
  <div><h1>Carte interactive</h1><p class="muted fs-15 mt-8" id="sub"></p></div>
  <form class="toolbar" id="search" role="search" aria-label="Filtrer les formations">
    <div><label for="q">Mots-clés</label><input type="search" id="q" name="q" placeholder="ex. jeu vidéo, design" autocomplete="off"></div>
    <div><label for="zone">Zone géographique</label><input type="search" id="zone" name="zone" placeholder="ex. Bretagne, Lyon" autocomplete="off"></div>
    <div><label for="groupe">Groupe de mentions</label><select id="groupe" name="groupe"></select></div>
    <div class="tb-more"><label for="mention">Mention</label><select id="mention" name="mention"><option value="">Toutes</option></select></div>
    <div class="tb-more"><label for="taux-min">Taux d’accès</label>
      <select id="taux-min"><option value="0">Tous</option><option value="10">10 % et plus</option><option value="20">20 % et plus</option><option value="30">30 % et plus</option></select></div>
    <label class="toggle tb-more"><input type="checkbox" id="alt">Alternance</label>
    <button class="btn p">Rechercher</button>
    <button type="button" class="btn toolbar-toggle" id="tb-toggle" aria-expanded="false">Plus de filtres</button>
  </form>

  <div class="split">
    <div class="map grow" id="map">
      <div class="emap" id="emap" role="img" aria-label="Carte de France des Masters en lettres, langage et arts"></div>
      <div class="tools"><button class="btn p" data-reset hidden>← Vue France</button><div class="zoom"><button class="btn" data-zoom="1.6" aria-label="Zoomer">+</button><button class="btn" data-zoom="0.625" aria-label="Dézoomer">−</button></div></div>
      <div class="legend">Chaque bulle regroupe les formations proches : clique pour zoomer · ⌘ / Ctrl + molette ou pincement pour zoomer, la molette seule fait défiler la page</div>
    </div>
    <aside class="card col panel" id="panel" aria-live="polite"></aside>
  </div>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet/leaflet.markercluster.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/france-outline.js"></script>
<script src="js/map.js"></script>
<script src="js/carte.js"></script>
</body>
</html>
