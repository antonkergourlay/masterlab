<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formations · Master Lab</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="formations">
<main class="wrap col gap-20 pt-32">
  <div class="row between">
    <div><h1>Formations</h1><p class="muted fs-15 mt-8" id="count"></p></div>
    <div class="row">
      <button class="btn" id="filters-btn" aria-expanded="false" aria-controls="filters">Filtres</button>
      <label for="sort" class="m-0">Trier par</label>
      <select id="sort" class="w-auto">
        <option value="taux">Taux d’accès (le plus élevé)</option>
        <option value="places">Nombre de places</option>
        <option value="cand">Candidatures (les plus demandées)</option>
        <option value="emploi">Insertion de la discipline à 18 mois</option>
        <option value="nom">Ville (A → Z)</option>
      </select>
    </div>
  </div>
  <div class="split aw-280">
    <aside class="card col" id="filters">
      <h2 class="h3">Filtres</h2>
      <div><label for="q">Mots-clés</label><input type="search" id="q" placeholder="ex. jeu vidéo, design" autocomplete="off"></div>
      <div><label for="zone">Zone géographique</label><input type="search" id="zone" placeholder="ex. Bretagne, Lyon" autocomplete="off"></div>
      <div><label for="groupe">Groupe de mentions</label><select id="groupe"></select></div>
      <div><label for="mention">Mention</label><select id="mention"></select></div>
      <div><label for="taux-min">Taux d’accès minimum <span id="taux-help"></span></label>
        <select id="taux-min"><option value="0">Peu importe</option><option value="10">10 % et plus</option><option value="20">20 % et plus</option><option value="30">30 % et plus</option></select></div>
      <label class="check"><input type="checkbox" id="alt"> En alternance uniquement</label>
      <button class="btn" id="clear">Effacer les filtres</button>
      <a href="carte.html" id="to-map">Voir sur la carte →</a>
    </aside>
    <div class="col grow" id="list" aria-live="polite"></div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/formations.js"></script>
</body>
</html>
